<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYNS admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12233B">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/">LYNS</a>
    <span class="mini-link">Admin</span>
  </header>
  <main class="scroll" id="view" aria-live="polite"></main>
  <nav class="tabbar" id="adminNav" aria-label="Admin sections" hidden>
    <button class="tab active" data-section="queue" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Queue
    </button>
    <button class="tab" data-section="live" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      Live
    </button>
    <button class="tab" data-section="add" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/assets/admin.js"></script>
<script src="/assets/pwa.js"></script>
</body>
</html>
