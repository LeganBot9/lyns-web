<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYNS — offline</title>
<meta name="theme-color" content="#12233B">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:32px;
    font-family:Georgia,"Times New Roman",serif;background:#0C1A2C;color:#EEF2F8}
  .mark{font-size:56px;font-weight:700;letter-spacing:.02em}
  p{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;
    line-height:1.6;color:#8DA3C4;max-width:22em;margin:0}
  button{font:inherit;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;
    color:#0C1A2C;background:#EEF2F8;border:0;border-radius:999px;padding:11px 22px;
    margin-top:8px;cursor:pointer}
</style>
</head>
<body>
  <div class="mark">L</div>
  <p>You're offline. LYNS needs a connection to load what's happening around you.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
